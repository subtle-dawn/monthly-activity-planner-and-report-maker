<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月間活動目標・報告メーカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="header-fields">
      <input id="year" type="number" min="1" max="9999" step="1" inputmode="numeric" aria-label="年"><span class="year-suffix">年</span>
      <select id="month" aria-label="月"></select><span>月活動</span><span id="mode-label">目標</span>
    </div>
    <div class="header-actions">
      <div class="data-actions">
        <button id="import-data" class="action-icon" type="button" aria-label="データを読み込む" title="データを読み込む">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 13v7h16v-7M12 3v12m-4-4 4 4 4-4" />
          </svg>
        </button>
        <button id="export-data" class="action-icon" type="button" aria-label="データを書き出す" title="データを書き出す">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 13v7h16v-7M12 15V3m-4 4 4-4 4 4" />
          </svg>
        </button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <button class="primary action-icon" id="download" type="button" aria-label="画像を保存" title="画像を保存">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8" cy="8" r="1.5" />
          <path d="m3 17 5-5 4 4 4-6 5 7" />
        </svg>
      </button>
    </div>
  </header>
  <main>
    <div class="workspace">
      <section class="editor" aria-label="活動内容の編集">
        <div id="sections"></div>
        <button class="add-section" id="add-section" type="button">＋ 見出しを追加</button>
      </section>
    </div>
    <p id="message" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
