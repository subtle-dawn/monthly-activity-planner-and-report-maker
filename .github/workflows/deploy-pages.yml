name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check pwa.js
          node --check sw.js
          node --test tests/pwa.test.cjs

      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html style.css app.js favicon.svg manifest.webmanifest pwa.js sw.js _site/
          cp -R icons _site/
          sed -i "s/const VERSION = 'v1';/const VERSION = '${GITHUB_SHA}';/" _site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
